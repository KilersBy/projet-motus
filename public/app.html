<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Motus PHP</title><link rel="stylesheet" href="/style.css"></head><body><main><h1>Mo mo mo MOTUS !</h1><section id="auth" class="card"><h2>Connexion</h2><input id="username" placeholder="Pseudo"><input id="password" type="password" placeholder="Mot de passe"><button onclick="login()">Se connecter</button><button onclick="register()">Créer un compte</button><p id="authMsg"></p></section><section id="game" class="card hidden"><div class="top"><span id="hello"></span><button onclick="logout()">Déconnexion</button></div><label>Difficulté <select id="difficulty"><option>facile</option><option selected>moyen</option><option>difficile</option></select></label><button onclick="newGame()">Nouvelle partie</button><div id="grid"></div><div class="play"><input id="guess" maxlength="12" placeholder="Votre mot"><button onclick="sendGuess()">Valider</button></div><p id="msg"></p><h2>Classement</h2><ol id="leaderboard"></ol></section></main><script src="/app.js"></script></body></html>
